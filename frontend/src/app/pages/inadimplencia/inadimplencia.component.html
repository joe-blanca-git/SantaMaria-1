<div class="page-container">
  <div class="main-layout">
    
    <!-- Sidebar -->
    <aside class="main-sidebar" [class.collapsed]="isSidebarCollapsed">
      <div class="sidebar-header d-flex justify-content-end mb-3 pb-2 border-bottom">
        <button class="btn btn-sm text-muted sidebar-toggle" (click)="toggleSidebar()"
          style="background: transparent; border: none; padding: 0.25rem 0.5rem; border-radius: 6px;">
          <i class="fa-solid" [ngClass]="isSidebarCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
        </button>
      </div>
      
      <ul class="main-nav">
        <li>
          <button class="main-nav-link" [class.active]="activeTab === 'dashboards'" (click)="setActiveTab('dashboards')" title="Dashboards">
            <i class="fa-solid fa-chart-line"></i> <span class="nav-text">Dashboards</span>
          </button>
        </li>
        <li>
          <button class="main-nav-link" [class.active]="activeTab === 'inadimplencia'" (click)="setActiveTab('inadimplencia')" title="Inadimplência">
            <i class="fa-solid fa-file-invoice-dollar"></i> <span class="nav-text">Inadimplência</span>
          </button>
        </li>
        <li>
          <button class="main-nav-link" [class.active]="activeTab === 'representantes'" (click)="setActiveTab('representantes')" title="Representantes">
            <i class="fa-solid fa-user-tie"></i> <span class="nav-text">Representantes</span>
          </button>
        </li>
        <li>
          <button class="main-nav-link" [class.active]="activeTab === 'gerentes'" (click)="setActiveTab('gerentes')" title="Gerentes">
            <i class="fa-solid fa-user-shield"></i> <span class="nav-text">Gerentes</span>
          </button>
        </li>
        <li>
          <button class="main-nav-link" [class.active]="activeTab === 'pendencias'" (click)="setActiveTab('pendencias')" title="Pendências">
            <i class="fa-solid fa-triangle-exclamation"></i> <span class="nav-text">Pendências</span>
          </button>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="tab-content custom-tab-content">
        
        <!-- Tab Dashboards -->
        <div class="tab-pane fade" [class.show]="activeTab === 'dashboards'" [class.active]="activeTab === 'dashboards'" role="tabpanel">
          <div class="config-layout">
            <div class="dashboard-header border-bottom">
              <h3 class="mb-0 p-3" style="font-size: 1.5rem; font-weight: 600;">Dashboards</h3>
            </div>
            <div class="p-3">
              <!-- Conteúdo de Dashboards virá aqui -->
              <p class="text-muted">Conteúdo de Dashboards</p>
            </div>
          </div>
        </div>

        <!-- Tab Inadimplência -->
        <div class="tab-pane fade" [class.show]="activeTab === 'inadimplencia'" [class.active]="activeTab === 'inadimplencia'" role="tabpanel">
          <div class="config-layout">
            <div class="dashboard-header border-bottom">
              <h3 class="mb-0 p-3" style="font-size: 1.5rem; font-weight: 600;">Inadimplência</h3>
            </div>
            <div class="p-3">
              <!-- Conteúdo de Inadimplência virá aqui -->
              <p class="text-muted">Conteúdo de Inadimplência</p>
            </div>
          </div>
        </div>

        <!-- Tab Representantes -->
        <div class="tab-pane fade" [class.show]="activeTab === 'representantes'" [class.active]="activeTab === 'representantes'" role="tabpanel">
          <div class="config-layout">
            <div class="dashboard-header border-bottom">
              <h3 class="mb-0 p-3" style="font-size: 1.5rem; font-weight: 600;">Representantes</h3>
            </div>
            <div class="p-3">
              <!-- Conteúdo de Representantes virá aqui -->
              <p class="text-muted">Conteúdo de Representantes</p>
            </div>
          </div>
        </div>

        <!-- Tab Gerentes -->
        <div class="tab-pane fade" [class.show]="activeTab === 'gerentes'" [class.active]="activeTab === 'gerentes'" role="tabpanel">
          <div class="config-layout">
            <div class="dashboard-header border-bottom">
              <h3 class="mb-0 p-3" style="font-size: 1.5rem; font-weight: 600;">Gerentes</h3>
            </div>
            <div class="p-3">
              <!-- Conteúdo de Gerentes virá aqui -->
              <p class="text-muted">Conteúdo de Gerentes</p>
            </div>
          </div>
        </div>

        <!-- Tab Pendências -->
        <div class="tab-pane fade" [class.show]="activeTab === 'pendencias'" [class.active]="activeTab === 'pendencias'" role="tabpanel">
          <div class="config-layout">
            <div class="dashboard-header border-bottom">
              <h3 class="mb-0 p-3" style="font-size: 1.5rem; font-weight: 600;">Pendências</h3>
            </div>
            <div class="p-3">
              <!-- Conteúdo de Pendências virá aqui -->
              <app-pendencias></app-pendencias>
            </div>
          </div>
        </div>

      </div>
    </main>

  </div>
</div>
